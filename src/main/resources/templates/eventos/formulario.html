<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evento - Controle de Eventos</title>

    <!-- CSS da página de eventos -->
    <link rel="stylesheet" th:href="@{/css/eventos.css}">
</head>

<body>

<header>
    <div class="container">

        <h1>Controle de Eventos</h1>

        <p>Cadastre ou edite um evento</p>

        <!-- MENU PRINCIPAL -->
        <nav>
            <a th:href="@{/}">
                Início
            </a>

            <a th:href="@{/eventos}">
                Eventos
            </a>

            <a th:href="@{/participantes}">
                Participantes
            </a>

            <a th:href="@{/inscricoes/nova}">
                Inscrições
            </a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="formulario">

        <!--
            Se o ID estiver vazio, estamos cadastrando.
            Se o ID existir, estamos editando.
        -->
        <h2 th:text="${evento.id == null ? 'Cadastrar Evento' : 'Editar Evento'}">
            Cadastrar Evento
        </h2>

        <p>
            Preencha os dados do evento abaixo.
        </p>


        <!--
            Envia os dados para o EventoController.
        -->
        <form
            th:action="@{/eventos/salvar}"
            th:object="${evento}"
            method="post">

            <!-- ID do evento -->
            <input
                type="hidden"
                th:field="*{id}">


            <!-- Nome -->
            <div class="campo">

                <label for="nome">
                    Nome:
                </label>

                <input
                    type="text"
                    id="nome"
                    th:field="*{nome}"
                    placeholder="Digite o nome do evento"
                    required>

            </div>


            <!-- Local -->
            <div class="campo">

                <label for="local">
                    Local:
                </label>

                <input
                    type="text"
                    id="local"
                    th:field="*{local}"
                    placeholder="Digite o local do evento"
                    required>

            </div>


            <!-- Data -->
            <div class="campo">

                <label for="data">
                    Data:
                </label>

                <input
                    type="date"
                    id="data"
                    th:field="*{data}"
                    required>

            </div>


            <!-- Capacidade -->
            <div class="campo">

                <label for="capacidadeMaxima">
                    Capacidade máxima:
                </label>

                <input
                    type="number"
                    id="capacidadeMaxima"
                    th:field="*{capacidadeMaxima}"
                    placeholder="Digite a capacidade"
                    min="1"
                    required>

            </div>


            <!-- Botões -->
            <div class="botoes-formulario">

                <!-- Salvar -->
                <button
                    type="submit"
                    class="btn-salvar">

                    Salvar Evento

                </button>


                <!-- Voltar para a tela principal -->
                <a
                    th:href="@{/}"
                    class="btn-cancelar">

                    ← Voltar para tela principal

                </a>

            </div>

        </form>

    </section>

</main>


<!-- JavaScript dos eventos -->
<script th:src="@{/js/eventos.js}"></script>

</body>

</html>

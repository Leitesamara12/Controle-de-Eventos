<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eventos - Controle de Eventos</title>

    <!-- CSS da página de eventos -->
    <link rel="stylesheet" th:href="@{/css/eventos.css}">

</head>

<body>

<header>

    <div class="container">

        <h1>Controle de Eventos</h1>

        <p>Cadastre e gerencie seus eventos</p>

    </div>

</header>


<main class="container">

    <!-- ==============================
         TOPO DA LISTA
         ============================== -->

    <section class="topo-lista">

        <div>

            <h2>Eventos cadastrados</h2>

            <p>
                Confira os eventos registrados no sistema.
            </p>

        </div>

        <!-- Botão para criar novo evento -->

        <a
            th:href="@{/eventos/novo}"
            class="btn-novo">

            + Novo Evento

        </a>

    </section>


    <!-- ==============================
         CAMPO DE BUSCA
         ============================== -->

    <section class="filtro-container">

        <input
            type="text"
            id="filtro"
            placeholder="🔍 Buscar evento..."
            onkeyup="filtrarEventos()">

    </section>


    <!-- ==============================
         TABELA DE EVENTOS
         ============================== -->

    <section class="tabela-container">

        <table>

            <thead>

            <tr>

                <th>Nome</th>

                <th>Local</th>

                <th>Data</th>

                <th>Capacidade</th>

                <th>Ações</th>

            </tr>

            </thead>


            <tbody id="listaEventos">

            <!--
                Thymeleaf percorre todos os eventos
                enviados pelo EventoController.
            -->

            <tr th:each="evento : ${eventos}">

                <!-- Nome -->

                <td th:text="${evento.nome}">
                    Nome do evento
                </td>


                <!-- Local -->

                <td th:text="${evento.local}">
                    Local
                </td>


                <!-- Data -->

                <td th:text="${evento.data}">
                    Data
                </td>


                <!-- Capacidade -->

                <td th:text="${evento.capacidadeMaxima}">
                    Capacidade
                </td>


                <!-- ==============================
                     AÇÕES
                     ============================== -->

                <td class="acoes">


                    <!-- EDITAR -->

                    <a
                        th:href="@{/eventos/editar/{id}(id=${evento.id})}"
                        class="btn-editar">

                        Editar

                    </a>


                    <!-- PARTICIPANTES -->

                    <a
                        th:href="@{/inscricoes/evento/{id}(id=${evento.id})}"
                        class="btn-participantes">

                        👥 Participantes

                    </a>


                    <!-- EXCLUIR -->

                    <a
                        th:href="@{/eventos/excluir/{id}(id=${evento.id})}"
                        class="btn-excluir"
                        onclick="return confirmarExclusao()">

                        Excluir

                    </a>

                </td>

            </tr>


            <!-- ==============================
                 NENHUM EVENTO
                 ============================== -->

            <tr th:if="${#lists.isEmpty(eventos)}">

                <td
                    colspan="5"
                    class="sem-eventos">

                    Nenhum evento cadastrado.

                </td>

            </tr>

            </tbody>

        </table>

    </section>

</main>


<!-- JavaScript -->

<script th:src="@{/js/eventos.js}"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participantes do Evento - Controle de Eventos</title>

    <!-- CSS das inscrições -->
    <link rel="stylesheet" th:href="@{/css/inscricoes.css}">

</head>

<body>

<header>

    <div class="container">

        <h1>Controle de Eventos</h1>

        <p>Participantes inscritos no evento</p>

    </div>

</header>


<main class="container">

    <!-- Informações do evento -->
    <section class="topo-lista">

        <div>

            <h2 th:text="${evento.nome}">
                Nome do evento
            </h2>

            <p>
                Confira os participantes inscritos neste evento.
            </p>

        </div>

        <!-- Voltar para a lista de eventos -->
        <a
            th:href="@{/eventos}"
            class="btn-novo">

            ← Voltar para eventos

        </a>

    </section>


    <!-- Informações resumidas -->
    <section class="tabela-container">

        <table>

            <thead>

            <tr>

                <th>Nome</th>

                <th>E-mail</th>

                <th>Telefone</th>

            </tr>

            </thead>


            <tbody>

            <!--
                Percorre as inscrições do evento.
                Cada inscrição possui um participante.
            -->
            <tr
                th:each="inscricao : ${evento.inscricoes}">

                <td
                    th:text="${inscricao.participante.nome}">

                    Nome do participante

                </td>

                <td
                    th:text="${inscricao.participante.email}">

                    E-mail

                </td>

                <td
                    th:text="${inscricao.participante.telefone}">

                    Telefone

                </td>

            </tr>


            <!-- Caso o evento ainda não tenha participantes -->
            <tr
                th:if="${#lists.isEmpty(evento.inscricoes)}">

                <td
                    colspan="3"
                    class="sem-eventos">

                    Nenhum participante inscrito neste evento.

                </td>

            </tr>

            </tbody>

        </table>

    </section>

</main>


<script th:src="@{/js/inscricoes.js}"></script>

</body>

</html>

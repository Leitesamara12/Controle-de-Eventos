<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Inscrição - Controle de Eventos</title>

    <link rel="stylesheet" th:href="@{/css/inscricoes.css}">

</head>

<body>

<header>

    <div class="container">

        <h1>Controle de Eventos</h1>

        <p>Realize a inscrição de participantes nos eventos</p>

    </div>

</header>


<main class="container">

    <section class="formulario">

        <h2>Nova Inscrição</h2>

        <p class="descricao">
            Selecione o evento e o participante para realizar a inscrição.
        </p>


        <!--
            Mensagem de erro enviada pelo Controller.
            Pode aparecer quando o evento estiver lotado
            ou quando o participante já estiver inscrito.
        -->
        <div
            th:if="${erro}"
            class="mensagem-erro"
            th:text="${erro}">

            Erro ao realizar inscrição.

        </div>


        <form
            th:action="@{/inscricoes/salvar}"
            method="post">


            <!-- Seleção do evento -->
            <div class="campo">

                <label for="eventoId">
                    Evento:
                </label>

                <select
                    id="eventoId"
                    name="eventoId"
                    required>

                    <option value="">
                        Selecione um evento
                    </option>

                    <!--
                        Thymeleaf percorre todos os eventos
                        enviados pelo Controller.
                    -->
                    <option
                        th:each="evento : ${eventos}"
                        th:value="${evento.id}"
                        th:text="${evento.nome}">

                        Nome do evento

                    </option>

                </select>

            </div>


            <!-- Seleção do participante -->
            <div class="campo">

                <label for="participanteId">
                    Participante:
                </label>

                <select
                    id="participanteId"
                    name="participanteId"
                    required>

                    <option value="">
                        Selecione um participante
                    </option>

                    <!--
                        Thymeleaf percorre todos os participantes
                        enviados pelo Controller.
                    -->
                    <option
                        th:each="participante : ${participantes}"
                        th:value="${participante.id}"
                        th:text="${participante.nome}">

                        Nome do participante

                    </option>

                </select>

            </div>


            <!-- Botões -->
            <div class="botoes-formulario">

                <button
                    type="submit"
                    class="btn-salvar">

                    Realizar Inscrição

                </button>


                <a
                    th:href="@{/eventos}"
                    class="btn-cancelar">

                    Cancelar

                </a>

            </div>

        </form>

    </section>

</main>


<script th:src="@{/js/inscricoes.js}"></script>

</body>

</html>
